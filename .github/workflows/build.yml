name: Build native binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: Mesh-macos.zip
            bundle_cmd: |
              cd dist
              zip -r ../Mesh-macos.zip Mesh.app
              cd ..
          - os: windows-latest
            artifact: Mesh-windows.zip
            bundle_cmd: |
              cd dist
              powershell Compress-Archive -Path Mesh.exe -DestinationPath ../Mesh-windows.zip
              cd ..

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend deps + build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: PyInstaller build
        run: pyinstaller mesh.spec --noconfirm

      - name: Package
        shell: bash
        run: ${{ matrix.bundle_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          fail_on_unmatched_files: false
